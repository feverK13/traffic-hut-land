<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Success</title>
    <link rel="stylesheet" href="./success.css" />

    <!-- Meta Pixel Code -->
    <script>
      !(function (f, b, e, v, n, t, s) {
        if (f.fbq) return;
        n = f.fbq = function () {
          n.callMethod
            ? n.callMethod.apply(n, arguments)
            : n.queue.push(arguments);
        };
        if (!f._fbq) f._fbq = n;
        n.push = n;
        n.loaded = !0;
        n.version = "2.0";
        n.queue = [];
        t = b.createElement(e);
        t.async = !0;
        t.src = v;
        s = b.getElementsByTagName(e)[0];
        s.parentNode.insertBefore(t, s);
      })(
        window,
        document,
        "script",
        "https://connect.facebook.net/en_US/fbevents.js",
      );
      fbq("init", "1644816010096418");
      fbq("track", "PageView");
      fbq("track", "Lead");
    </script>
    <noscript
      ><img
        height="1"
        width="1"
        style="display: none"
        src="https://www.facebook.com/tr?id=1644816010096418&ev=PageView&noscript=1"
    /></noscript>
    <!-- End Meta Pixel Code -->
  </head>
  <body>
    <div class="success-container">
      <div class="icon-success">&#10003;</div>
      <!-- Unicode checkmark symbol -->
      <h1>Success!</h1>
      <p>Your submission has been processed successfully.</p>

      <div class="debug-info">
        <strong>Debug ID:</strong> <span id="debugId"></span>
        <small>(This ID is for testing purposes only.)</small>
      </div>
    </div>

    <script src="./main.js"></script>
    <script>
      document.addEventListener("DOMContentLoaded", () => {
        const params = new URLSearchParams(window.location.search);
        const clickId = params.get("click_id");

        if (clickId) {
          const postbackUrl = `https://globalvisitlog.com/cf/cv?click_id=${clickId}&payout=1`;

          fetch(postbackUrl, { mode: "no-cors" })
            .then(() =>
              console.log(
                "✅ Сигнал конверсії успішно відправлено в Clickflare!",
              ),
            )
            .catch((err) => console.error("Помилка відправки конверсії:", err));
        } else {
          console.warn(
            "🟡 click_id не знайдено в URL. Конверсія не відправлена.",
          );
        }
      });
    </script>
  </body>
</html>
